# Workflow to automatically lint gdscript code
name: gdlint on push

on:
  [push, pull_request]

jobs:
  gdlint:
    name: gdlint scripts
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Ensure python is installed
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install gdtoolkit
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gdtoolkit==4.*'

      # Lint all project scripts (rules in .gdlintrc; addons are upstream code)
      - name: Lint Godot VR Template scripts
        run: |
          gdlint components config game tools
