# This workflow builds the Godot VR Template for multiple target systems.
---


# Publish Demo workflow
name: Publish Demo


# Trigger rules (adjust to configure when CI is performed)
on:
  [push, pull_request]


# Environment variables
env:
  # Configure Godot version (setup-godot needs major.minor.patch).
  # 4.6.1-stable exists on https://github.com/godotengine/godot-builds/releases
  # (checked 2026-10-24; 4.6.3 is the newest 4.6 patch). The project targets
  # the 4.6 feature level, so any 4.6.x editor can open it - see README.
  GODOT_VERSION: 4.6.1

  # OpenXR Vendors version (keep in sync with tools/setup_vendors.sh)
  OPENXR_VENDORS_VERSION: 4.3.0-stable

  # Butler API Key (comment to disable). Without the BUTLER_API_KEY secret no
  # upload is attempted.
  BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

  # Butler User/Game: the itch.io "user/game" page tagged releases are pushed
  # to. PLACEHOLDER - change it to your own itch.io page before adding the
  # BUTLER_API_KEY secret (it used to point at upstream's godot-xr/godot-xr-template).
  BUTLER_USER_GAME: eedali/godot-vr-template


# CI jobs
jobs:
  # Build job (Matrix build for all exports)
  build:
    name: Building for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Export for Windows
          - name: 🏁 Windows
            os: windows-latest
            platform: windows
            export-preset: Windows
            export-type: release
            export-folder: build/windows
            export-file: build/windows/Game.exe
            archive: Windows
            butler-channel: windows

          # Export for Linux
          - name: 🐧 Linux
            os: ubuntu-22.04
            platform: linux
            export-preset: Linux
            export-type: release
            export-folder: build/linux
            export-file: build/linux/Game.x86_64
            archive: Linux
            butler-channel: linux

          # Export for Android Quest
          - name: 🤖 Android Quest
            os: ubuntu-22.04
            platform: android
            export-preset: Android Quest
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-quest
            export-file: build/android-quest/Game.apk
            archive: Android-Quest
            butler-channel: android-quest

          # Export for WebXR
          - name: 🌐 WebXR
            os: ubuntu-22.04
            platform: web
            export-preset: WebXR
            export-type: release
            export-folder: build/webxr
            export-file: build/webxr/index.html
            archive: WebXR
            butler-channel: webxr

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install the OpenXR Vendors Plugin
      - name: Install OpenXR Vendors Plugin
        shell: bash
        run: |
          curl -L -O https://github.com/GodotVR/godot_openxr_vendors/releases/download/${{ env.OPENXR_VENDORS_VERSION }}/godotopenxrvendorsaddon.zip
          unzip -o godotopenxrvendorsaddon.zip -d godotopenxrvendorsaddon
          mkdir -p addons
          mv godotopenxrvendorsaddon/asset/addons/godotopenxrvendors addons/godotopenxrvendors
          rm godotopenxrvendorsaddon.zip
          rm -rf godotopenxrvendorsaddon

      # If targeting android then install JDK
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # If targeting android then install Android SDK Packages
      # NOTE: ubuntu runners already ship the Android SDK, so there is no
      # setup-android action step. (android-actions/setup-android@v3 was
      # removed: it runs "sdkmanager tools" and the obsolete "tools" package
      # no longer exists, failing every Android job with exit code 1.)
      - name: Install Android SDK Packages
        if: matrix.platform == 'android'
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      # Android debug exports need a debug keystore; CI has none, so create a
      # throw-away one and hand it to Godot through its documented env vars.
      - name: Create Android debug keystore
        if: matrix.platform == 'android'
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      # Setup Godot
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      # Import Godot Project
      - name: Initial Godot Import
        shell: bash
        run: |
          godot --headless --verbose --import || exit 0

      # Export project. The import above may report errors on a fresh
      # checkout (no .godot cache yet), so it stays tolerant; the export must
      # succeed and produce the expected file.
      - name: Export Godot Project
        shell: bash
        run: |
          set -o pipefail
          rm -f "${{ matrix.export-file }}"
          godot --headless ${{ matrix.export-args }} --export-${{ matrix.export-type }} "${{ matrix.export-preset }}" 2>&1 | tee export.log
          if grep -E "ERROR: (Project export|Cannot export|Failed to export)" export.log; then
            echo "::error::Godot reported an export error"
            exit 1
          fi
          if [ ! -f "${{ matrix.export-file }}" ]; then
            echo "::error::Expected export output ${{ matrix.export-file }} is missing"
            exit 1
          fi

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}-Artifacts
          path: |
            ${{ matrix.export-folder }}/*.*
            !**/.gitignore

      # Install butler (if building release with butler support)
      - name: Install Butler
        if: >
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          env.BUTLER_API_KEY != ''
        uses: remarkablegames/setup-butler@v1
        with:
          butler-version: LATEST

      # Push to itch.io (if building release)
      - name: Push to itch.io
        if: >
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          env.BUTLER_API_KEY != ''
        run: >
          butler push
          --ignore '.gitignore'
          ${{ matrix.export-folder }}
          ${{ env.BUTLER_USER_GAME }}:${{ matrix.butler-channel }}
          --userversion ${{ github.ref_name }}

      # Compress project (if building release)
      - name: Compress Project
        if: >
          github.event_name == 'push' &&
          github.ref_type == 'tag'
        run: |
          cd ${{ matrix.export-folder }}
          7z a -tzip ${{ matrix.archive }}.zip *.* -x'!.gitignore'

      # Publish release (if building release)
      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: >
          github.event_name == 'push' &&
          github.ref_type == 'tag'
        with:
          allowUpdates: true
          artifacts: '${{ matrix.export-folder }}/${{ matrix.archive }}.zip'
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
